<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formal Complaint Generator — FixRoute</title>
  <meta name="description" content="Generate a formal, polite, and factual legal grievance letter for Indian grievance officers, ombudsmen, and consumer disputes.">
 <link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .style-pill {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      transition: all var(--transition-fast);
    }
    .style-pill.active {
      background: var(--primary-navy);
      color: white;
      border-color: var(--primary-navy);
    }
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon" style="width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span style="font-size:1.3rem; font-weight:800; color:white;">FIXROUTE</span>
        </div>
        <p>Tell us your problem. We'll tell you who can fix it.</p>
        <p style="font-size: 0.825rem; color: #64748B;">Founder: Sreekar</p>
      </div>
      <div class="footer-col">
        <h4>Navigation</h4>
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/search.html">Find a Solution</a></li>
          <li><a href="/tracker.html">Complaint Tracker</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>Trust & Legal</h4>
        <ul>
          <li><a href="/about.html">About FixRoute</a></li>
          <li><a href="/privacy.html">Privacy Policy</a></li>
          <li><a href="/terms.html">Terms of Service</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <div>&copy; 2026 FixRoute. Built for India.</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    let currentStyle = "formal";
    let activeRouteId = null;

    document.addEventListener("DOMContentLoaded", () => {
      // Pre-fill from query params if passed from route detail
      const urlParams = new URLSearchParams(window.location.search);
      const org = urlParams.get("org");
      const issue = urlParams.get("issue");
      const cat = urlParams.get("cat");
      const routeId = urlParams.get("route_id");
      const evidence = urlParams.get("evidence");

      if (org) document.getElementById("gen-org").value = org;
      if (issue) document.getElementById("gen-issue").value = issue;
      if (routeId) activeRouteId = parseInt(routeId);

      // Pre-fill user name if logged in
      if (window.fixRoute.user) {
        document.getElementById("gen-name").value = window.fixRoute.user.full_name;
      }

      if (org && issue) {
        handleGenerate();
      }
    });

    function setStyle(style, btnEl) {
      currentStyle = style;
      document.querySelectorAll(".style-pill").forEach(el => el.classList.remove("active"));
      btnEl.classList.add("active");
      handleGenerate();
    }

    async function handleGenerate(e) {
      if (e) e.preventDefault();
      const name = document.getElementById("gen-name").value.trim() || "[Your Full Name]";
      const org = document.getElementById("gen-org").value.trim();
      const issue = document.getElementById("gen-issue").value.trim();
      const date = document.getElementById("gen-date").value.trim();
      const ref = document.getElementById("gen-ref").value.trim();
      const prior = document.getElementById("gen-prior").value.trim();
      const relief = document.getElementById("gen-relief").value.trim() || "Immediate resolution and formal response";

      const evChecked = Array.from(document.querySelectorAll(".gen-ev-chk:checked")).map(el => el.value);

      if (!org || !issue) {
        return;
      }

      try {
        const result = await window.fixRoute.generateDraft({
          route_id: activeRouteId,
          user_name: name,
          organization: org,
          issue_description: issue,
          incident_date: date || null,
          previous_attempts: prior || null,
          previous_ref_number: ref || null,
          desired_resolution: relief,
          evidence_collected: evChecked,
          style: currentStyle
        });

        document.getElementById("draft-subject-preview").textContent = result.subject;
        document.getElementById("draft-body-preview").value = result.body;
        showToast("Complaint draft updated.", "info");
      } catch (err) {
        showToast("Error generating draft: " + err.message, "error");
      }
    }

    function copyDraftToClipboard() {
      const body = document.getElementById("draft-body-preview").value;
      if (!body) return;
      navigator.clipboard.writeText(body).then(() => {
        showToast("Complaint draft copied to clipboard!", "success");
      }).catch(() => {
        showToast("Failed to copy automatically. Please select text and copy manually.", "error");
      });
    }

    function downloadDraftAsTxt() {
      const subject = document.getElementById("draft-subject-preview").textContent;
      const body = document.getElementById("draft-body-preview").value;
      if (!body) return;

      const fullContent = `SUBJECT: ${subject}\n\n${body}`;
      const blob = new Blob([fullContent], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `FixRoute_Complaint_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Complaint downloaded as text file.", "success");
    }

    function printDraft() {
      const subject = document.getElementById("draft-subject-preview").textContent;
      const body = document.getElementById("draft-body-preview").value;
      if (!body) return;

      const printArea = document.getElementById("printable-area");
      printArea.innerHTML = `<h2>${escapeHTML(subject)}</h2><hr style="margin:1rem 0;"><pre style="font-family:inherit; white-space:pre-wrap;">${escapeHTML(body)}</pre>`;
      window.print();
    }

    function openEmailClient() {
      const subject = document.getElementById("draft-subject-preview").textContent;
      const body = document.getElementById("draft-body-preview").value;
      if (!body) return;

      const mailtoUrl = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;
    }

    async function saveDraftToAccount() {
      if (!window.fixRoute.isAuthenticated()) {
        openAuthModal("login");
        showToast("Please sign in to save complaint drafts to your account.", "info");
        return;
      }

      const org = document.getElementById("gen-org").value.trim();
      const issue = document.getElementById("gen-issue").value.trim();
      const subject = document.getElementById("draft-subject-preview").textContent;
      const body = document.getElementById("draft-body-preview").value;

      try {
        await window.fixRoute.saveDraft({
          route_id: activeRouteId,
          title: `Grievance - ${org}`,
          organization: org,
          issue_description: issue,
          style: currentStyle,
          subject,
          body
        });
        showToast("Draft saved to your dashboard successfully!", "success");
      } catch (err) {
        showToast(err.message || "Failed to save draft", "error");
      }
    }

    function trackThisComplaint() {
      const org = document.getElementById("gen-org").value.trim();
      const issue = document.getElementById("gen-issue").value.trim();
      const ref = document.getElementById("gen-ref").value.trim();

      const params = new URLSearchParams();
      params.append("org", org);
      params.append("title", issue.slice(0, 60));
      if (ref) params.append("ref", ref);
      if (activeRouteId) params.append("route_id", activeRouteId);

      window.location.href = `/tracker.html?${params.toString()}`;
    }
  </script>
</body>
</html>
