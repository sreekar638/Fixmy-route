  <script>
    async function handleContactSubmit(e) {
      e.preventDefault();
      const rating = parseInt(document.getElementById("contact-rating").value);
      const msg = document.getElementById("contact-message").value.trim();

      try {
        await window.fixRoute.submitFeedback({
          rating,
          helpful: rating >= 3,
          comment: msg,
          page_url: window.location.href
        });
        showToast("Thank you for your feedback! It helps improve FixRoute.", "success");
        document.getElementById("contact-feedback-form").reset();
      } catch (err) {
        showToast("Error: " + err.message, "error");
      }
    }
  </script>
