<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard — FixRoute</title>
 <link rel="stylesheet" href="/css/brand.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .dash-nav-item {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      color: var(--text-dark);
      transition: background var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dash-nav-item:hover, .dash-nav-item.active {
      background-color: #EFF6FF;
      color: var(--secondary-blue);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="header-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon" style="width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span style="font-size:1.3rem; font-weight:800; color:white;">FIXROUTE</span>
        </div>
        <p>Tell us your problem. We'll tell you who can fix it.</p>
        <p style="font-size: 0.825rem; color: #64748B;">Founder: Sreekar</p>
      </div>
      <div class="footer-col">
        <h4>Explore</h4>
        <ul>
          <li><a href="/search.html">Find a Solution</a></li>
          <li><a href="/tracker.html">Track Complaint</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>Trust & Legal</h4>
        <ul>
          <li><a href="/privacy.html">Privacy Policy</a></li>
          <li><a href="/terms.html">Terms of Service</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <div>&copy; 2026 FixRoute. Built for India.</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkAuthAndInit();
      window.addEventListener("fixroute:auth-change", checkAuthAndInit);
    });

    function checkAuthAndInit() {
      const guardBox = document.getElementById("guest-guard-box");
      const authView = document.getElementById("authenticated-view");

      if (!window.fixRoute.isAuthenticated()) {
        guardBox.style.display = "block";
        authView.style.display = "none";
        return;
      }

      guardBox.style.display = "none";
      authView.style.display = "block";

      const user = window.fixRoute.user;
      if (user) {
        document.getElementById("user-greeting").textContent = `Welcome, ${user.full_name}`;
        document.getElementById("user-email-display").textContent = `${user.email} &bull; FixRoute Citizen Account`;
      }

      loadSavedRoutes();
    }

    function switchTab(tabId, tabEl) {
      document.querySelectorAll(".dash-nav-item").forEach(el => el.classList.remove("active"));
      tabEl.classList.add("active");

      document.querySelectorAll("#tab-content-area > div").forEach(div => div.style.display = "none");
      document.getElementById(`tab-${tabId}`).style.display = "block";

      if (tabId === 'saved-routes') loadSavedRoutes();
      if (tabId === 'complaints-tab') loadDashboardComplaints();
      if (tabId === 'drafts-tab') loadDrafts();
      if (tabId === 'history-tab') loadSearchHistory();
    }

    async function loadSavedRoutes() {
      const list = document.getElementById("saved-routes-list");
      try {
        const saved = await window.fixRoute.getSavedRoutes();
        if (saved.length === 0) {
          list.innerHTML = `
            <div class="card" style="text-align:center; padding:3rem; color:var(--text-muted);">
              <p>You haven't bookmarked any problem routes yet.</p>
              <a href="/search.html" class="btn btn-outline btn-sm" style="margin-top:0.75rem;">Find a Solution</a>
            </div>
          `;
          return;
        }

        list.innerHTML = saved.map(s => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div>
              <span class="badge badge-category" style="margin-bottom:0.25rem;">${escapeHTML(s.category_name)}</span>
              <h4 style="font-size:1.15rem; color:var(--primary-navy); margin-top:0.25rem;">${escapeHTML(s.route_title)}</h4>
              <p style="font-size:0.85rem; color:var(--text-muted);">Authority: ${escapeHTML(s.responsible_authority)}</p>
            </div>
            <div style="display:flex; gap:0.5rem;">
              <a href="/route-detail.html?id=${s.route_id}" class="btn btn-primary btn-sm">Open Guide &rarr;</a>
              <button class="btn btn-outline btn-sm" style="color:var(--error);" onclick="unsaveRoute(${s.id})">Remove</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-danger">${escapeHTML(err.message)}</div>`;
      }
    }

    async function unsaveRoute(id) {
      try {
        await window.fixRoute.unsaveRoute(id);
        showToast("Route removed from saved list.", "info");
        loadSavedRoutes();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function loadDashboardComplaints() {
      const list = document.getElementById("dashboard-complaints-list");
      try {
        const complaints = await window.fixRoute.getComplaints();
        if (complaints.length === 0) {
          list.innerHTML = `<p style="color:var(--text-muted);">No tracked complaints found. <a href="/tracker.html">Log one in the Tracker</a>.</p>`;
          return;
        }
        list.innerHTML = complaints.slice(0, 5).map(c => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem;">
            <div>
              <span class="badge status-${c.status.toLowerCase().replace(/\s+/g, '-')}">${escapeHTML(c.status)}</span>
              <h4 style="font-size:1.05rem; margin-top:0.25rem;">${escapeHTML(c.title)}</h4>
              <span style="font-size:0.8rem; color:var(--text-muted);">${escapeHTML(c.organization_name)} &bull; Ref: ${escapeHTML(c.reference_number || 'None')}</span>
            </div>
            <a href="/tracker.html" class="btn btn-outline btn-sm">View in Tracker &rarr;</a>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-danger">${escapeHTML(err.message)}</div>`;
      }
    }

    async function loadDrafts() {
      const list = document.getElementById("drafts-list");
      try {
        const drafts = await window.fixRoute.getDrafts();
        if (drafts.length === 0) {
          list.innerHTML = `
            <div class="card" style="text-align:center; padding:3rem; color:var(--text-muted);">
              <p>No saved complaint drafts yet.</p>
              <a href="/complaint-generator.html" class="btn btn-outline btn-sm" style="margin-top:0.75rem;">Create a Complaint Draft</a>
            </div>
          `;
          return;
        }

        list.innerHTML = drafts.map(d => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem;">
              <div>
                <h4 style="font-size:1.1rem; color:var(--primary-navy);">${escapeHTML(d.title)}</h4>
                <span style="font-size:0.8rem; color:var(--text-muted);">Style: ${escapeHTML(d.style)} &bull; ${new Date(d.created_at).toLocaleDateString('en-IN')}</span>
              </div>
              <button class="btn btn-outline btn-sm" style="color:var(--error);" onclick="deleteDraft(${d.id})">Delete</button>
            </div>
            <p style="font-size:0.875rem; color:#334155; font-family:monospace; background:#F8FAFC; padding:0.75rem; border-radius:var(--radius-md); max-height:100px; overflow-y:hidden;">
              ${escapeHTML(d.body.slice(0, 200))}...
            </p>
            <div style="margin-top:0.75rem;">
              <button class="btn btn-outline btn-sm" onclick="copyText('${encodeURIComponent(d.body)}')">Copy Full Letter</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-danger">${escapeHTML(err.message)}</div>`;
      }
    }

    async function deleteDraft(id) {
      if (!confirm("Delete this draft?")) return;
      try {
        await window.fixRoute.deleteDraft(id);
        showToast("Draft deleted.", "info");
        loadDrafts();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function copyText(encoded) {
      navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
        showToast("Complaint draft copied to clipboard!", "success");
      });
    }

    async function loadSearchHistory() {
      const list = document.getElementById("search-history-list");
      try {
        const history = await window.fixRoute.getSearchHistory();
        if (history.length === 0) {
          list.innerHTML = `<p style="color:var(--text-muted);">No search history recorded.</p>`;
          return;
        }

        list.innerHTML = history.map(h => `
          <div class="card" style="padding:0.75rem 1rem; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span style="font-weight:600; color:var(--primary-navy);">${escapeHTML(h.query_text)}</span>
              <span style="font-size:0.8rem; color:var(--text-muted); margin-left:0.5rem;">${h.result_count} results found</span>
            </div>
            <a href="/search.html?q=${encodeURIComponent(h.query_text)}" class="btn btn-outline btn-sm">Repeat Search</a>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-danger">${escapeHTML(err.message)}</div>`;
      }
    }

    async function clearSearchHistory() {
      if (!confirm("Clear your entire search history?")) return;
      try {
        await window.fixRoute.clearSearchHistory();
        showToast("Search history cleared.", "success");
        loadSearchHistory();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const oldPwd = document.getElementById("old-pwd").value;
      const newPwd = document.getElementById("new-pwd").value;
      try {
        await window.fixRoute.request("/api/auth/change-password", {
          method: "POST",
          body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
        });
        showToast("Password updated successfully!", "success");
        document.getElementById("change-pwd-form").reset();
      } catch (err) {
        showToast(err.message || "Failed to update password", "error");
      }
    }

    async function handleDeleteAccount() {
      if (!confirm("Are you ABSOLUTELY sure? This will delete your account and all associated data permanently.")) return;
      try {
        await window.fixRoute.deleteAccount();
        alert("Your account and records have been deleted.");
        window.location.href = "/";
      } catch (err) {
        showToast(err.message, "error");
      }
    }
  </script>
</body>
</html>
